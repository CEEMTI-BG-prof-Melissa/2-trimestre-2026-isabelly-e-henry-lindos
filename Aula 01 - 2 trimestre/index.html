<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Formulario html</title>
    <meta charset="UTF-8">
</head>

<body> 
    <h1>Cadastro de Usuário</h1>
        <form  action="cadastro.php" method="POST">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">
        <br>
        <label for="email"> E-mail:</label> 
        <input type="email" id="email" name="email">
        <br>
        <label for="senha"> Senha :</label> 
        <input type="password" id="senha" name="senha">
        <br>
        <label for="idade"> Idade :</label> 
        <input type="number" id="idade" name="idade">
        <br>
        <label for="data">nascimento:</label> 
        <input type="date" id="nascimento" name="nascimento">
        <br>
        <p>Turno:</p>
        <input type="radio" name="turno" id="manha"> <label for ="manha">Manhã</label>
        <input type="radio" name="turno" id="tarde"> <label for ="tarde">Tarde</label>
        <input type="radio" name="turno" id="noite"> <label for ="noite">noite</label>
        <br>
        <p>Àrea de interese</p>
        <input type="checkbox" name="area" id="programacao"> <label for="programacao">Programação</label>
        <input type="checkbox" name="area" id="desing"> <label for="desing">Desing</label>
        <input type="checkbox" name="area" id="redes"> <label for="redes">Redes</label>
        <br>
        <input type="reset" value="Limpar">
        <input type="submit" value="Enviar">
    </form>
</body>    
</html>
